# Configuración del servidor
server.port=7001

# Configuración de Base de Datos (MySQL)
db.url=jdbc:mysql://localhost:3306/deepsky_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
db.user=
db.password=

# Clave de la API de la NASA
nasa.api.key=

# Credenciales de Cloudinary (Subida de Imágenes para Retos de Astrofotografía)
cloudinary.cloud_name=
cloudinary.api_key=
cloudinary.api_secret=
jwt.secret=

# Moderación de contenido de usuarios (foro, comentarios, retos)
# --- Texto ---
# No requiere credenciales: usa src/main/resources/moderacion/palabras-prohibidas.txt
# --- Imágenes (Sightengine, https://sightengine.com — tiene plan gratuito) ---
sightengine.api.user=
sightengine.api.secret=
moderacion.imagenes.enabled=true
# Si "true": si Sightengine falla (red/timeout/credenciales), la imagen se RECHAZA.
# Si "false" (default): si Sightengine falla, la imagen se deja pasar y se registra el incidente.
moderacion.imagenes.estricta=false